<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Твій Евакуатор CRM</title>
    <script type="text/javascript">
        // GitHub Pages SPA redirect for HashRouter
        // Since we use HashRouter, we just need to redirect to the base path
        // The hash fragment is preserved automatically
        var repo = '/tviy.evakuator-crm-frontend/';
        var l = window.location;
        // If the path has sub-paths beyond the repo name, redirect to base with hash
        var pathAfterRepo = l.pathname.replace(repo, '');
        if (pathAfterRepo && pathAfterRepo !== '/' && pathAfterRepo !== '') {
            l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                repo + '#/' + pathAfterRepo + l.search + l.hash
            );
        } else if (!l.hash) {
            // No hash, redirect to index
            l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                repo
            );
        }
    </script>
</head>

<body>
</body>

</html>
